<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawxide whiteboard</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font: 13px/1.3 system-ui, sans-serif; }
  #board { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #tools { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 2px;
           padding: 4px; background: #fff; border: 1px solid #ddd; border-radius: 10px;
           box-shadow: 0 2px 8px rgba(0,0,0,.12); user-select: none; z-index: 2; }
  #tools button { border: 0; background: transparent; padding: 6px 9px; border-radius: 6px; cursor: pointer; font: inherit; color: #222; }
  #tools button:hover { background: #f0f0f0; }
  #tools button[aria-pressed="true"] { background: #2f80ed; color: #fff; }
  #tools button:disabled { opacity: .35; cursor: default; background: transparent; }
  #tools .sep { width: 1px; background: #e4e4e4; margin: 3px 4px; }
  #status { position: fixed; left: 10px; top: 8px; color: #888; font-size: 12px; user-select: none; z-index: 2; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="board" tabindex="0"></canvas>
<div id="tools" role="toolbar" aria-label="Tools">
  <button data-tool="select" title="Select (V)">Select</button>
  <button data-tool="hand" title="Hand (H)">Hand</button>
  <button data-tool="draw" title="Draw (D)">Draw</button>
  <button data-tool="eraser" title="Eraser (E)">Eraser</button>
  <button data-tool="geo" title="Rectangle (R)">Rect</button>
  <button data-tool="geo:ellipse" title="Ellipse (O)">Ellipse</button>
  <button data-tool="arrow" title="Arrow (A)">Arrow</button>
  <button data-tool="text" title="Text (T)">Text</button>
  <button data-tool="note" title="Note (N)">Note</button>
  <span class="sep"></span>
  <button data-cmd="undo" title="Undo (Cmd+Z)">Undo</button>
  <button data-cmd="redo" title="Redo (Cmd+Shift+Z)">Redo</button>
</div>
<div id="status">loading the engine…</div>
<script type="module" src="./whiteboard.js"></script>
</body>
</html>
